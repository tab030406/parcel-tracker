<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郵局包裹查詢</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --paper: #F1ECDD;
    --paper-dim: #E7E0CC;
    --ink: #2B2620;
    --ink-soft: #6B6353;
    --green: #204B3C;
    --green-deep: #16352A;
    --red: #B5432F;
    --gold: #B98B34;
    --line: #C9BFA4;
    --card: #FBF8EF;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 18% 8%, rgba(181,67,47,0.05) 0, transparent 45%),
      radial-gradient(circle at 82% 92%, rgba(32,75,60,0.06) 0, transparent 50%);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    padding: 36px 18px 60px;
    min-height: 100vh;
  }

  .wrap{ max-width: 720px; margin: 0 auto; }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 16px;
    border-bottom: 3px solid var(--green);
    padding-bottom: 18px;
    margin-bottom: 26px;
  }

  .brand{ display:flex; align-items:center; gap: 12px; }

  .brand-mark{
    width:46px; height:46px;
    border-radius:50%;
    background: var(--green);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:18px;
    flex-shrink:0;
  }

  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size: 26px;
    margin:0;
    line-height:1.3;
    letter-spacing: 0.02em;
  }

  .sub{ color: var(--ink-soft); font-size: 13px; margin-top: 4px; }

  .addbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 22px; }

  input[type=text]{
    font-family:'Space Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 3px;
    flex: 1 1 220px;
    min-width: 0;
  }
  input[type=text]::placeholder{ color:#A79E88; font-family:'Noto Sans TC',sans-serif; }
  input[type=text]:focus{ outline:none; border-color: var(--green); }
  input[type=text].label-input{ font-family:'Noto Sans TC', sans-serif; flex: 0 1 140px; }

  button{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:500;
    font-size: 14px;
    border: none;
    border-radius: 3px;
    padding: 10px 16px;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  button:active{ transform: translateY(1px); }

  .btn-green{ background: var(--green); color:#fff; }
  .btn-green:hover{ background: var(--green-deep); }
  .btn-ghost{ background: transparent; color: var(--green); border:1.5px solid var(--green); }
  .btn-ghost:hover{ background: rgba(32,75,60,0.08); }

  .toolrow{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
  }
  .toolrow .count{ font-size:13px; color:var(--ink-soft); }

  .list{ display:flex; flex-direction:column; gap: 16px; }

  .card{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .card::before{ content:""; position:absolute; top:0; left:0; bottom:0; width: 5px; background: var(--green); }
  .card.state-error::before{ background: var(--red); }
  .card.state-loading::before{ background: var(--gold); }

  .card-inner{ padding: 16px 18px 16px 22px; }

  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap: 12px; flex-wrap: wrap; }

  .card-meta .num{ font-family:'Space Mono', monospace; font-size: 16px; letter-spacing: 0.03em; }
  .card-meta .dest{ font-size: 13px; color: var(--ink-soft); margin-top: 3px; }

  .card-actions{ display:flex; gap:8px; align-items:center; }

  .icon-btn{
    background: transparent; border: none; color: var(--ink-soft);
    font-size: 13px; padding: 6px 8px; text-decoration: underline; text-underline-offset: 2px;
  }
  .icon-btn:hover{ color: var(--red); }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12px;
    padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line);
    color: var(--ink-soft); white-space:nowrap;
  }
  .status-pill.done{ border-color: var(--green); color: var(--green); }
  .status-pill.err{ border-color: var(--red); color: var(--red); }
  .status-pill.loading{ border-color: var(--gold); color: #8A6A20; }

  .dot{ width:6px; height:6px; border-radius:50%; background: currentColor; }

  .timeline{ margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .ev{ display:grid; grid-template-columns: 130px 1fr 110px; gap: 10px; padding: 7px 0; font-size: 13px; align-items:baseline; }
  .ev:not(:last-child){ border-bottom: 1px solid var(--paper-dim); }
  .ev .t{ font-family:'Space Mono', monospace; color: var(--ink-soft); font-size:12px; }
  .ev .s{ font-weight:500; }
  .ev .b{ color: var(--ink-soft); text-align:right; font-size:12px; }
  .ev:first-child .s{ color: var(--green); }

  .fallback{ margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-soft); line-height:1.6; }
  .fallback .actions{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }

  .empty{ text-align:center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; border: 1.5px dashed var(--line); border-radius: 4px; }

  footer{ margin-top: 34px; font-size: 12px; color: var(--ink-soft); text-align:center; line-height:1.7; }
  footer a{ color: var(--green); }

  @media (max-width: 480px){
    .ev{ grid-template-columns: 1fr; gap:2px; }
    .ev .b{ text-align:left; }
    header{ flex-direction:column; align-items:flex-start; gap:10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">郵</div>
      <div>
        <h1>包裹查詢台</h1>
        <div class="sub">中華郵政國內包裹進度</div>
      </div>
    </div>
  </header>

  <div class="addbar">
    <input type="text" id="newLabel" class="label-input" placeholder="寄達地（選填）">
    <input type="text" id="newNumber" placeholder="輸入執據號碼，例如 90390632004470220003">
    <button class="btn-green" id="addBtn">新增並查詢</button>
  </div>

  <div class="toolrow">
    <span class="count" id="countText">共 0 件</span>
    <button class="btn-ghost" id="queryAllBtn">全部重新查詢</button>
  </div>

  <div class="list" id="list"></div>

  <div class="empty" id="emptyState" style="display:none;">
    尚未加入任何包裹，請於上方輸入執據號碼。
  </div>

  <footer>
    中華郵政官方查詢頁有圖形驗證碼保護，本工具無法自動繞過，會先嘗試直接查詢；若被瀏覽器安全機制或驗證碼擋下，會顯示官方查詢頁連結，複製號碼貼過去手動查即可。<br>
    官方查詢網址：<a href="http://postserv.post.gov.tw/pstmail/main_mail.html" target="_blank" rel="noopener">postserv.post.gov.tw/pstmail/main_mail.html</a>　
    客服 0800-700-365
  </footer>

</div>

<script>
const API_URL = "https://postserv.post.gov.tw/pstmail/EsoafDispatcher";
const OFFICIAL_PAGE = "http://postserv.post.gov.tw/pstmail/main_mail.html";

let parcels = [
  { id: cryptoId(), number: "90390632004470220003", label: "新北市板橋區", status: "idle", events: [], errorMsg: "" },
  { id: cryptoId(), number: "90390732004470320009", label: "桃園市中壢區", status: "idle", events: [], errorMsg: "" },
  { id: cryptoId(), number: "90390832004470401004", label: "台中市東區",   status: "idle", events: [], errorMsg: "" },
];

function cryptoId(){ return 'p' + Math.random().toString(36).slice(2, 10); }

function fmtDatime(d){
  if(!d || d.length < 14) return d || "";
  return `${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)} ${d.slice(8,10)}:${d.slice(10,12)}`;
}

async function queryOne(parcel){
  parcel.status = "loading";
  parcel.errorMsg = "";
  render();

  const payload = {
    header: {
      InputVOClass: "com.systex.jbranch.app.server.post.vo.EB500100InputVO",
      TxnCode: "EB500100", BizCode: "query2", StampTime: true,
      SupvPwd: "", TXN_DATA: {}, SupvID: "", CustID: "", REQUEST_ID: "",
      ClientTransaction: true, DevMode: false, SectionID: "esoaf"
    },
    body: { MAILNO: parcel.number, pageCount: 10 }
  };

  try{
    const res = await fetch(API_URL, {
      method: "POST", mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    const items = data?.[0]?.body?.host_rs?.ITEM;
    const list = Array.isArray(items) ? items : (items ? [items] : []);

    if(list.length === 0){
      parcel.status = "blocked";
      parcel.errorMsg = "自動查詢查無結果（可能是該介面需要驗證碼），請改用下方連結手動查詢。";
    } else {
      parcel.events = list.map(it => ({
        time: fmtDatime(it.DATIME), status: (it.STATUS||"").trim(), station: (it.BRHNC||"").trim()
      }));
      parcel.status = "done";
    }
  }catch(err){
    parcel.status = "blocked";
    parcel.errorMsg = "瀏覽器擋下了跨站查詢，請改用下方連結手動查詢。";
  }
  render();
}

function queryAll(){ parcels.forEach(p => queryOne(p)); }

function removeParcel(id){ parcels = parcels.filter(p => p.id !== id); render(); }

function addParcel(){
  const numInput = document.getElementById('newNumber');
  const labelInput = document.getElementById('newLabel');
  const number = numInput.value.replace(/\s/g,'').trim();
  const label = labelInput.value.trim();
  if(!number){ numInput.focus(); return; }
  const p = { id: cryptoId(), number, label, status: "idle", events: [], errorMsg: "" };
  parcels.push(p);
  numInput.value = ""; labelInput.value = "";
  render();
  queryOne(p);
}

function copyNumber(number, btn){
  navigator.clipboard?.writeText(number).then(()=>{
    const old = btn.textContent;
    btn.textContent = "已複製";
    setTimeout(()=>{ btn.textContent = old; }, 1400);
  });
}

function statusPill(p){
  if(p.status === "loading") return `<span class="status-pill loading"><span class="dot"></span>查詢中…</span>`;
  if(p.status === "done") return `<span class="status-pill done"><span class="dot"></span>已取得最新進度</span>`;
  if(p.status === "blocked") return `<span class="status-pill err"><span class="dot"></span>需手動查詢</span>`;
  return `<span class="status-pill"><span class="dot"></span>尚未查詢</span>`;
}

function render(){
  const list = document.getElementById('list');
  const empty = document.getElementById('emptyState');
  document.getElementById('countText').textContent = `共 ${parcels.length} 件`;

  if(parcels.length === 0){ list.innerHTML = ""; empty.style.display = "block"; return; }
  empty.style.display = "none";

  list.innerHTML = parcels.map(p => {
    const stateClass = p.status === "blocked" ? "state-error" : p.status === "loading" ? "state-loading" : "";

    let body = "";
    if(p.status === "done" && p.events.length){
      body = `<div class="timeline">${p.events.map(e => `
        <div class="ev"><span class="t">${e.time}</span><span class="s">${e.status}</span><span class="b">${e.station}</span></div>`).join("")}</div>`;
    } else if(p.status === "blocked"){
      body = `<div class="fallback">${p.errorMsg}
        <div class="actions">
          <button class="btn-ghost" onclick="copyNumber('${p.number}', this)">複製號碼</button>
          <a class="btn-green" style="display:inline-block;text-decoration:none;line-height:1;padding:10px 16px;" href="${OFFICIAL_PAGE}" target="_blank" rel="noopener">開啟官方查詢頁</a>
        </div></div>`;
    }

    return `
      <div class="card ${stateClass}">
        <div class="card-inner">
          <div class="card-head">
            <div class="card-meta">
              <div class="num">${p.number}</div>
              <div class="dest">${p.label || "（未標註寄達地）"}</div>
            </div>
            <div class="card-actions">
              ${statusPill(p)}
              <button class="icon-btn" onclick="removeParcel('${p.id}')">移除</button>
            </div>
          </div>
          ${body}
        </div>
      </div>`;
  }).join("");
}

document.getElementById('addBtn').addEventListener('click', addParcel);
document.getElementById('newNumber').addEventListener('keydown', e => { if(e.key === 'Enter') addParcel(); });
document.getElementById('queryAllBtn').addEventListener('click', queryAll);

render();
</script>
</body>
</html>
